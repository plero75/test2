<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Transports Vincennes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <img src="img/logo-idfm.svg" alt="IDFM" />
      <img src="img/logo-ratp.svg" alt="RATP" />
      <img src="img/logo-vhp.svg" alt="VHP" />
      <span>Dashboard Transports Vincennes</span>
    </div>
    <div id="datetime"></div>
  </header>

  <div class="alert-banner" id="traffic-alert">Chargement des alertes trafic...</div>

  <main class="wrapper">
    <section class="transport-block" id="weather-block">
      <h2>☀️ Météo</h2>
      <div id="weather-summary"></div>
      <div id="weather-update"></div>
    </section>

    <section class="transport-block" id="velib-block">
      <h2>🚲 Vélib’</h2>
      <div id="velib-vincennes"></div>
      <div id="velib-breuil"></div>
      <div id="velib-update"></div>
    </section>

    <section class="transport-block" id="news-block">
      <h2>📰 France Info</h2>
      <div id="newsTicker"></div>
    </section>

    <section class="transport-block" id="rer-block">
      <h2>🚆 RER A – Joinville-le-Pont</h2>
      <div id="rer-a-passages"></div>
      <div id="rer-a-alert"></div>
      <div id="rer-a-update"></div>
    </section>

    <section class="transport-block" id="bus77-block">
      <h2>🚌 Bus 77 – Hippodrome de Vincennes</h2>
      <div id="bus-77-passages"></div>
      <div id="bus-77-alert"></div>
      <div id="bus-77-update"></div>
    </section>

    <section class="transport-block" id="bus201-block">
      <h2>🚌 Bus 201 – École du Breuil</h2>
      <div id="bus-201-passages"></div>
      <div id="bus-201-alert"></div>
      <div id="bus-201-update"></div>
    </section>
  </main>

  <footer>
    <div>
      <img src="img/picto-info.svg" alt="Info" />
      <span>© 2025 IDFM Dashboard – Mentions légales</span>
    </div>
    <div>Dernière mise à jour : <span id="datetime-footer"></span></div>
  </footer>

  <script src="script.js" type="module"></script>
</body>
</html>
